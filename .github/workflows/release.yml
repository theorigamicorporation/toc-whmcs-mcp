name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to build and publish, e.g. v1.2.0"
        required: true

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: .tool-versions
          cache: true

      - name: resolve version
        id: version
        run: echo "value=${{ inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      # A release must not ship code that does not pass its own tests.
      - name: test
        run: go test -race ./...

      - name: build binaries
        env:
          VERSION: ${{ steps.version.outputs.value }}
          COMMIT: ${{ github.sha }}
        run: |
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/arm64; do
            os="${target%/*}"; arch="${target#*/}"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath \
              -ldflags "-s -w \
                -X github.com/theorigamicorporation/toc-whmcs-mcp/internal/version.Version=${VERSION} \
                -X github.com/theorigamicorporation/toc-whmcs-mcp/internal/version.Commit=${COMMIT}" \
              -o "dist/toc-whmcs-mcp-${os}-${arch}" ./cmd/toc-whmcs-mcp
          done
          (cd dist && sha256sum * > SHA256SUMS)

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Published by version tag only. Deployments should reference the digest
      # printed below, or this immutable tag; never a moving one.
      - name: build and push image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ steps.version.outputs.value }}
          build-args: |
            VERSION=${{ steps.version.outputs.value }}
            COMMIT=${{ github.sha }}

      - name: report the image digest
        run: |
          {
            echo "### Image"
            echo ""
            echo '```'
            echo "ghcr.io/${{ github.repository }}:${{ steps.version.outputs.value }}"
            echo "ghcr.io/${{ github.repository }}@${{ steps.push.outputs.digest }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.value }}
          files: dist/*
          body: |
            Image: `ghcr.io/${{ github.repository }}@${{ steps.push.outputs.digest }}`

            Reference the digest in deployments. The server starts in the
            `readonly` profile; destructive actions require both an explicit
            profile and `WHMCS_MCP_ALLOW_DESTRUCTIVE=true`.

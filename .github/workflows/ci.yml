name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: .tool-versions
          cache: true

      - name: check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::unformatted files:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: build
        run: go build ./...

      # The race detector matters here: the confirmation store is shared
      # mutable state that decides whether a destructive operation runs twice.
      # -coverpkg attributes the protocol tests in internal/app to the packages
      # they actually exercise.
      - name: test
        run: go test -race -coverpkg=./... -coverprofile=coverage.out -covermode=atomic ./...

      - name: coverage summary
        run: go tool cover -func=coverage.out | tail -1 >> "$GITHUB_STEP_SUMMARY"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: .tool-versions
          cache: true
      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest

  vulnerabilities:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: .tool-versions
          cache: true
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Build only. Publishing happens in release.yml, on a tag.
      - name: build image
        run: |
          docker build \
            --build-arg VERSION=ci-${{ github.sha }} \
            --build-arg COMMIT=${{ github.sha }} \
            -t toc-whmcs-mcp:ci .

      - name: the binary runs and reports its version
        run: docker run --rm toc-whmcs-mcp:ci --version

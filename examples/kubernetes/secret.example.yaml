# Placeholder only. Do not commit real credentials.
#
# Use SealedSecrets, External Secrets, or whatever the cluster already uses.
# The repo convention is that all state arrives through committed manifests, so
# creating this by hand with `kubectl create secret` is not the path.
#
# The auth token is a coarse gate answering "may you talk to this server". It is
# not an identity layer; the audit stream cannot attribute a call to a person
# through it. Generate one with: openssl rand -base64 48
apiVersion: v1
kind: Secret
metadata:
  name: toc-whmcs-mcp
type: Opaque
stringData:
  api-identifier: replace-me
  api-secret: replace-me
  auth-token: replace-me
